services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    shm_size: 1gb
    environment:
      POSTGRES_USER: synergy
      POSTGRES_PASSWORD: synergy
      POSTGRES_DB: synergy
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synergy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://synergy:synergy@postgres:5432/synergy
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"

  pipeline:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://synergy:synergy@postgres:5432/synergy
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "-m", "synergy"]
    command: ["status"]
    profiles: ["tools"]

volumes:
  postgres:
